<!--
  MarketX email signature — FULL variant.

  Paste-in fragment (no <html>/<head> wrapper on purpose).
  Replace every {{TOKEN}} before use. Tokens:
    {{FULL_NAME}}  Ada Okonkwo
    {{ROLE}}       Head of Seller Growth
    {{EMAIL}}      ada@marketx.africa
    {{PHONE}}      +234 806 683 8217        (display form)
    {{PHONE_E164}} +2348066838217           (tel: link, no spaces)
    {{WHATSAPP}}   2348066838217            (wa.me path, no + and no spaces)

  Rules of the road: inline styles only, tables only, no flex/grid/SVG,
  every link carries an explicit colour. See README.md before editing.
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:'Manrope','Segoe UI',Helvetica,Arial,sans-serif;color:#0B0B0F;">
  <tr>
    <!-- Mark -->
    <td width="58" style="width:58px;padding:2px 16px 0 0;vertical-align:top;">
      <img src="https://marketx.africa/icons/icon-180.png" width="44" height="44" alt="MarketX"
        style="display:block;width:44px;height:44px;border:0;outline:none;text-decoration:none;" />
    </td>

    <!-- Identity + contact -->
    <td style="vertical-align:top;padding:0 0 0 16px;border-left:1px solid #E2E8F0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">

        <!-- Name -->
        <tr>
          <td style="font-family:'Archivo','Manrope','Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:20px;font-weight:700;letter-spacing:-0.2px;color:#0B0B0F;padding:0 0 3px 0;">
            {{FULL_NAME}}
          </td>
        </tr>

        <!-- Role · Company -->
        <tr>
          <td style="font-size:13px;line-height:18px;color:#64748B;padding:0 0 9px 0;">
            {{ROLE}} &nbsp;·&nbsp; <span style="color:#0B0B0F;font-weight:600;">MarketX</span>
          </td>
        </tr>

        <!-- Brand rule -->
        <tr>
          <td style="padding:0 0 10px 0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
              <tr>
                <td width="28" height="2" style="width:28px;height:2px;background-color:#F43F5E;font-size:0;line-height:0;">&nbsp;</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Contact -->
        <tr>
          <td style="font-size:13px;line-height:20px;color:#475569;padding:0 0 2px 0;">
            <a href="mailto:{{EMAIL}}" style="color:#0B0B0F;text-decoration:none;">{{EMAIL}}</a>
          </td>
        </tr>
        <tr>
          <td style="font-size:13px;line-height:20px;color:#475569;padding:0 0 2px 0;">
            <a href="tel:{{PHONE_E164}}" style="color:#475569;text-decoration:none;">{{PHONE}}</a>
            <span style="color:#CBD5E1;">&nbsp;·&nbsp;</span>
            <a href="https://wa.me/{{WHATSAPP}}" style="color:#475569;text-decoration:none;">WhatsApp</a>
          </td>
        </tr>
        <tr>
          <td style="font-size:13px;line-height:20px;padding:0 0 10px 0;">
            <a href="https://marketx.africa" style="color:#F43F5E;text-decoration:none;font-weight:600;">marketx.africa</a>
          </td>
        </tr>

        <!-- Trust strip -->
        <tr>
          <td style="font-size:11px;line-height:15px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:#94A3B8;">
            Trade with trust &nbsp;·&nbsp; Escrow-protected payments
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
