<!--
  MarketX email signature — COMPACT variant.
  For replies and threads, where the full block becomes noise.
  Same tokens as signature.html. No image, so it never trips image-blocking.
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:'Manrope','Segoe UI',Helvetica,Arial,sans-serif;">
  <tr>
    <td style="padding:0 0 6px 0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <td width="24" height="2" style="width:24px;height:2px;background-color:#F43F5E;font-size:0;line-height:0;">&nbsp;</td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td style="font-size:13px;line-height:19px;color:#64748B;">
      <span style="font-weight:700;color:#0B0B0F;">{{FULL_NAME}}</span>
      &nbsp;·&nbsp; {{ROLE}}, MarketX
      <br />
      <a href="mailto:{{EMAIL}}" style="color:#64748B;text-decoration:none;">{{EMAIL}}</a>
      <span style="color:#CBD5E1;">&nbsp;·&nbsp;</span>
      <a href="tel:{{PHONE_E164}}" style="color:#64748B;text-decoration:none;">{{PHONE}}</a>
      <span style="color:#CBD5E1;">&nbsp;·&nbsp;</span>
      <a href="https://marketx.africa" style="color:#F43F5E;text-decoration:none;font-weight:600;">marketx.africa</a>
    </td>
  </tr>
</table>
